; ============================================================================
; DefaultEOS.ini — Configuración Oficial de Epic Online Services (UE 5.4)
; Proyecto: "La Copa Eterna" (SouthAmericaFightersCore)
; Soporta Cross-Play (Steam / PS5 / Xbox Series X|S), P2P NAT Traversal con
; AWS Relays forzados (sa-east-1 São Paulo / Santiago) y Lobbies CONMEBOL.
; ============================================================================

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemEOS]
bEnabled=true
; Desactivar Epic Account Services obligatorio (bUseEAS=False) y habilitar EOS Connect (bUseEOSConnect=True)
; para login transparente mediante tickets nativos de Steam, PSN y Xbox Live sin pedir cuenta extra.
bUseEAS=false
bUseEOSConnect=true
bUseEOSSessions=true
bMirrorStatsToEOS=true
bMirrorAchievementsToEOS=true

[/Script/OnlineSubsystemEOS.EOSSettings]
CacheDir=CacheDir
DefaultArtifactName=LaCopaEternaLive
TickBudgetInMilliseconds=1
bEnableOverlay=true
bEnableSocialOverlay=true
bShouldEnforceBeingLaunchedByEGS=false
TitleStorageReadChunkLength=65536
+Artifacts=(ArtifactName="LaCopaEternaLive",ClientId="xyza7891safconmebolclient01",ClientSecret="SAF_EOS_CLIENT_SECRET_PLACEHOLDER_ENV",ProductId="a1b2c3d4e5f6478990123456789abcde",SandboxId="f9e8d7c6b5a44321876543210fedcba9",DeploymentId="1029384756abcdef1029384756abcdef",EncryptionKey="11223344556677889900aabbccddeeff11223344556677889900aabbccddeeff")

[/Script/OnlineSubsystemEOS.NetDriverEOS]
bIsUsingP2PSockets=true
NetConnectionClassName="/Script/OnlineSubsystemEOS.NetConnectionEOS"

[SAF.Network.GGPO]
; Nombre del socket P2P dedicado al bucle determinista de 60 Hz
CombatSocketName=CONMEBOL_GGPO_60HZ
MaxRollbackFrames=8
DefaultLocalFrameDelay=1
; Forzar uso de servidores Relay de Epic/AWS para ocultar IPs y mitigar ataques DDoS
RelayControlMode=ForceRelays
MaxAcceptablePingMs=180
WiFiJitterExtraBufferFrames=1

[SAF.Matchmaking.Buckets]
; Filtros de emparejamiento cruzado (Cross-Play abierto por defecto y opción Solo Plataforma)
DefaultCrossplayBucket=AllPlatforms_CONMEBOL
FallbackSinglePlatformBucket=Platform_Only
PreferredRelayRegions=sa-east-1,us-east-1
